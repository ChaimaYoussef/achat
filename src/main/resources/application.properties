
#http://localhost:8089/SpringMVC/...

#Server configuration
server.servlet.context-path=/SpringMVC
server.port=8089

### DATABASE CONFIGURATION (Secured with Environment Variables) ###
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:achatdb}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:achat_user}
spring.datasource.password=${DB_PASSWORD:}

### JPA / HIBERNATE ###
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# Logging configuration (masked & hardened)
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework=INFO 
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{60} - %msg%n

### CORS CONFIGURATION ###
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

### SWAGGER / SPRINGFOX ###
spring.mvc.pathmatch.matching-strategy=ant_path_matcher



